- name: Upgrade all packages
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Apt Update
      ansible.builtin.apt:
        update-cache: true

    - name: List off upgradable packages
      ansible.builtin.command: apt list --upgradable
      register: upgradable_std

    - name: Set upgradable packages fact
      ansible.builtin.set_fact:
        upgradeable: "{{ upgradable_std.stdout_lines[1:] }}"

    - name: Upgrade all packages to the latest version
      ansible.builtin.apt:
        upgrade: dist

    - name: Show upgraded packages
      ansible.builtin.debug:
        msg: "{{ upgradeable }}"

    - name: Run ds -y -u
      ansible.builtin.expect:
        command: ds -y -u
        responses:
          (?i)password: "{{ ansible_become_pass }}\n"
          (?i)password for.*: "{{ ansible_become_pass }}\n"
        timeout: 60
        echo: true
      no_log: true
      become: false
      when: dockstarted | default(false)
