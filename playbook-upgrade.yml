- name: Upgrade all packages
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Upgrade all packages to the latest version
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
      tags:
        - upgrade

    - name: Run ds -y -u (DockStarter)
      ansible.builtin.expect:
        command: ds -y -u
        responses:
          (?i)password: "{{ ansible_become_pass }}\n"
          (?i)password for.*: "{{ ansible_become_pass }}\n"
        timeout: 60
        echo: true
      no_log: true
      become: false
      when: dockstarted | default(false)
      tags:
        - upgrade
