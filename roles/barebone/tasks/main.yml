---
# tasks file for barebone
# Rol de Kodi (media center): añade el PPA de Kodi e instala los paquetes.
# El `apt upgrade: dist` lo ejecuta el rol `main` (único lugar donde se hace).

- name: Add Kodi Repository
  ansible.builtin.apt_repository:
    repo: ppa:team-xbmc/ppa
    state: present
    update_cache: true
  tags:
    - packages

# Extra packages
- name: Install Extras Packages
  ansible.builtin.apt:
    name:
      - x264
      - x265
  tags:
    - packages

# Kodi packages
# Lista explícita (sin wildcards): los patrones `kodi-*` no se expanden en el
# módulo apt y fallan. Solo se listan los paquetes concretos necesarios.
- name: Install Kodi Packages
  ansible.builtin.apt:
    name:
      - kodi
      - kodi-inputstream-adaptive
      - kodi-inputstream-rtmp
      - kodi-peripheral-joystick
      - kodi-vfs-libarchive
  tags:
    - packages
