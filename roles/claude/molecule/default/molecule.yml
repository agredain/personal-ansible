dependency:
  name: galaxy
  enabled: false

driver:
  name: podman

platforms:
  - name: instance
    image: ubuntu:24.04
    pre_build_image: false

provisioner:
  name: ansible
  # El rol se resuelve desde roles/ (padre del rol), no depende del symlink
  # que molecule crea en create/ (syntax corre antes de create/).
  env:
    ANSIBLE_ROLES_PATH: ../../..
  inventory:
    group_vars:
      all:
        claude_cowork: true
        # Usuario que existe en el contenedor (root) para probar las tareas de Cowork.
        claude_desktop_user: root

verifier:
  name: ansible
