---
# tasks file for main
# Rol base: el único lugar donde se ejecuta `apt upgrade: dist` (compartido
# por playbook.yml y laptop.yml).

- name: Update all packages to the latest version
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
  tags:
    - upgrade

# ubuntu-restricted-extras instala ttf-mscorefonts-installer, que pide aceptar
# la EULA; sin esto la instalación no interactiva puede quedarse colgada.
- name: Accept Microsoft core fonts EULA
  ansible.builtin.debconf:
    name: ttf-mscorefonts-installer
    question: msttcorefonts/accepted-mscorefonts-eula
    value: "true"
    vtype: select
  tags:
    - packages

# Extra packages
- name: Install Extras Packages
  ansible.builtin.apt:
    name:
      - bat # A cat(1) clone with syntax highlighting and Git integration.
      - ubuntu-restricted-extras
      - exfat-fuse
      - exfatprogs # exfat-utils fue eliminado de Ubuntu; exfatprogs es el reemplazo
      - rar
      - unrar
      - zip
      - unzip
      - curl
      - lm-sensors # Sensores de temperatura, voltaje y ventiladores.
      - rmlint # Elimina archivos duplicados por hash.
      - preload # Acelera la carga de aplicaciones.
      - git
      - fish # Interprete de comandos.
      - ncdu # Estadísticas de carpetas en terminal.
      - most # Manpages a color.
      - bleachbit # Elimina archivos innecesarios del sistema.
  notify: Refresh font cache
  tags:
    - packages

# Microcódigo solo para la CPU del host (no existe en ARM, p. ej. Oracle Ampere).
- name: Install Intel microcode
  ansible.builtin.apt:
    name: intel-microcode
  when: ansible_processor | select('search', 'GenuineIntel') | list | length > 0
  tags:
    - packages

- name: Install AMD microcode
  ansible.builtin.apt:
    name: amd64-microcode
  when: ansible_processor | select('search', 'AuthenticAMD') | list | length > 0
  tags:
    - packages
