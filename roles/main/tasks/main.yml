---
# tasks file for main
# Rol base: el único lugar donde se ejecuta `apt upgrade: dist` (compartido
# por playbook.yml y laptop.yml).

- name: Update all packages to the latest version
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
  tags:
    - upgrade

# Extra packages
- name: Install Extras Packages
  ansible.builtin.apt:
    name:
      - bat # A cat(1) clone with syntax highlighting and Git integration.
      - ubuntu-restricted-extras
      - exfat-fuse
      - exfatprogs  # exfat-utils fue eliminado de Ubuntu; exfatprogs es el reemplazo
      - rar
      - unrar
      - zip
      - unzip
      - curl
      - neofetch # ASCII logo de la distro + información del sistema en terminal.
      - lm-sensors # Sensores de temperatura, voltaje y ventiladores.
      - intel-microcode # Microcódigo en procesadores Intel (reemplaza microcode.ctl).
      - amd64-microcode # Microcódigo en procesadores AMD (reemplaza microcode.ctl).
      - rmlint # Elimina archivos duplicados por hash.
      - preload # Acelera la carga de aplicaciones.
      - git
      - fish # Interprete de comandos.
      - ncdu # Estadísticas de carpetas en terminal.
      - most # Manpages a color.
      - bleachbit # Elimina archivos innecesarios del sistema.
  tags:
    - packages
