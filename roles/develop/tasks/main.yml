---
# tasks file for develop

- name: Install Zeal
  ansible.builtin.apt:
    name: zeal
    update_cache: true
    cache_valid_time: 3600
  tags:
    - packages

- name: Install CppCheck
  ansible.builtin.apt:
    name: cppcheck
  tags:
    - packages

- name: Install Docker
  ansible.builtin.apt:
    name: docker.io
  tags:
    - packages

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ develop_docker_user }}"
    groups: docker
    append: true
  tags:
    - config

- name: Prune docker images weekly
  ansible.builtin.cron:
    name: "Prune docker images"
    special_time: weekly
    job: "docker image prune -f"
  tags:
    - config
