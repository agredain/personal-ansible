---
# tasks file for develop

- name: Install Zeal
  ansible.builtin.apt:
    name: zeal
  tags:
    - packages

- name: Install CppCheck
  ansible.builtin.apt:
    name: cppcheck
  tags:
    - packages

- name: Install Docker
  ansible.builtin.apt:
    name: docker.io
  tags:
    - packages

- name: Prune docker images weekly
  ansible.builtin.cron:
    name: "Prune docker images"
    special_time: weekly
    job: "docker image prune -f"
  tags:
    - config
