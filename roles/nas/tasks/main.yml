---
# tasks file for nas

- name: Add General Backup Daemon Files
  ansible.builtin.copy:
    src: backup-script.service
    dest: /etc/systemd/system/backup-script.service
    force: true
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags:
    - services

# Servicio oneshot sin [Install]: lo arranca la regla udev al conectar el disco
# de backup, así que no se habilita ni se arranca aquí.

- name: Add General Backup Udev Files
  ansible.builtin.template:
    src: 90-mount_media_backup.rules.j2
    dest: /etc/udev/rules.d/90-mount_media_backup.rules
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev rules
  tags:
    - config

- name: Clean Agredain photos daily
  ansible.builtin.cron:
    name: "Clean Nextcloud photos"
    special_time: daily
    job: "/media/data/scripts/clean_photos.sh"
  tags:
    - config
