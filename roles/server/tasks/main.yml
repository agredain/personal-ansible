---
# tasks file for server

- name: Install Cockpit Packages
  ansible.builtin.apt:
    name:
      - cockpit
      - cockpit-networkmanager
      - cockpit-system
    update_cache: true
  notify: Restart cockpit
  tags:
    - packages

- name: Install Borgbackup Package
  ansible.builtin.apt:
    name: borgbackup
  tags:
    - packages

- name: Install Unattended Upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
  tags:
    - packages

- name: Config Unattended Email
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: 'Unattended-Upgrade::Mail\b'
    line: 'Unattended-Upgrade::Mail "{{ server_unattended_email }}";'
    state: present
  tags:
    - config

- name: Config Unattended MailReport
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: 'Unattended-Upgrade::MailReport\b'
    line: 'Unattended-Upgrade::MailReport "on-change";'
    state: present
  tags:
    - config

- name: Config Unattended Remove-Unused-Kernel-Packages
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: 'Unattended-Upgrade::Remove-Unused-Kernel-Packages\b'
    line: 'Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";'
    state: present
  tags:
    - config

- name: Config Unattended Remove-New-Unused-Dependencies
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: 'Unattended-Upgrade::Remove-New-Unused-Dependencies\b'
    line: 'Unattended-Upgrade::Remove-New-Unused-Dependencies "true";'
    state: present
  tags:
    - config

- name: Config Unattended Remove-Unused-Dependencies
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: 'Unattended-Upgrade::Remove-Unused-Dependencies\b'
    line: 'Unattended-Upgrade::Remove-Unused-Dependencies "true";'
    state: present
  tags:
    - config

# Equivalente idempotente a `dpkg-reconfigure -plow unattended-upgrades`.
- name: Enable Unattended Upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"
  tags:
    - config
