dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: instance
    image: ubuntu:24.04
    # El driver docker busca Dockerfile.j2 por defecto; el nuestro se llama Dockerfile.
    dockerfile: Dockerfile
    pre_build_image: false
    # El rol usa handlers systemd; el contenedor debe ejecutar systemd como PID 1.
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    # cgroup v2: systemd necesita compartir el namespace de cgroups del host.
    cgroupns_mode: host
    command: /lib/systemd/systemd

provisioner:
  name: ansible
  # El rol se resuelve desde roles/ (padre del rol), no depende del symlink
  # que molecule crea en create/ (syntax corre antes de create/).
  env:
    ANSIBLE_ROLES_PATH: ../../..
    # Colecciones del repo (community.docker para el driver, community.general...).
    ANSIBLE_COLLECTIONS_PATH: ../../../../.ansible/collections

verifier:
  name: ansible
