# Httpi (AppImage, se instala en el home del usuario de escritorio)
- name: Get version list of Httpi
  ansible.builtin.uri:
    url: https://api.github.com/repos/httpie/desktop/releases/latest
    return_content: true
    body_format: json
  register: laptop_httpi
  changed_when: false
  tags:
    - packages

- name: Gather Httpi version
  ansible.builtin.set_fact:
    laptop_httpi_latest: "{{ laptop_httpi.json.tag_name }}"
  tags:
    - packages

- name: Install Httpi
  ansible.builtin.get_url:
    url: "https://github.com/httpie/desktop/releases/download/{{ laptop_httpi_latest }}/HTTPie-{{ laptop_httpi_latest }}.AppImage"
    dest: "{{ laptop_desktop_home }}/Applications/HTTPie.AppImage"
    mode: "0755"
  become: true
  become_user: "{{ laptop_desktop_user }}"
  tags:
    - packages
