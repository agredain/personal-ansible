---
# tasks file for laptop
# Referencias:
# https://dev.to/uf4no/my-kubuntu-osx-look-alike-desktop-setup-219g
# https://nerdfonts.com/

# Other repositories
- name: Extra Repositories
  ansible.builtin.apt_repository:
    repo: "{{ item }}"
    state: present
  loop:
    - ppa:atareao/atareao # Touchpad-Indicator, Pomodoro Indicator, 2gi, My Weather Indicator. http://www.atareao.es/
    - ppa:webupd8team/y-ppa-manager # y-ppa-manager, herramienta para gestionar los PPAs.
    - ppa:libreoffice/ppa # LibreOffice PPA
    - ppa:nextcloud-devs/client
    - ppa:appimagelauncher-team/stable # Latest stable version of AppImageLauncher.
  tags:
    - repos

- name: Add Microsoft Extra fonts to all apps
  ansible.builtin.command: fc-cache -f
  changed_when: false
  tags:
    - config

# Extra packages
- name: Install Extras Packages
  ansible.builtin.apt:
    name:
      - appimagelauncher # Integrate AppImages to your application launcher with one click, and manage, update and remove them from there.
      - filelight # Ver el espacio ocupado por archivos y directorios de forma visual
      - gparted # Editor de particiones
      - hardinfo # Interfaz gráfica que muestra información del sistema, memoria, procesador, kernel, etc.
      - hplip
      - krename
      - kde-config-systemd # Acelerar apagado systemd. https://www.muylinux.com/2016/08/01/acelerar-apagado-systemd/
      - latte-dock # Dock para Plasma
      - libvlc5
      - meld
      - nextcloud-client
      - pdfmod # Editor PDF: reordenar, girar, quitar, añadir, combinar documentos.
      - picard # Análisis y reconocimiento de álbumes de música
      - pinta # Editor de imágenes
      - stacer # Optimización y monitoreo de sistemas Linux
      - simple-scan
      - variety # Cambia el fondo de escritorio de forma regular.
      - wakeonlan
      - vlc # Reproductor multimedia.
      - xbindkeys
      - xserver-xorg-input-synaptics # Para hacer funcionar el Touchpad
  tags:
    - packages

- name: Install Snap packages
  community.general.snap:
    name:
      - gitkraken
      - joplin-desktop
      - breaktimer # Pomodoro application
      - authy # strong authentication
      - auto-cpufreq # Automatic CPU speed & power optimizer for Linux
    classic: true
  tags:
    - packages

- name: Install Brave
  ansible.builtin.include_tasks: brave.yml
  tags:
    - packages

- name: Install Enpass
  ansible.builtin.include_tasks: enpass.yml
  tags:
    - packages

- name: Install Typora
  ansible.builtin.include_tasks: typora.yml
  tags:
    - packages

- name: Install Ferdi
  ansible.builtin.include_tasks: ferdi.yml
  tags:
    - packages

- name: Install Httpi Desktop
  ansible.builtin.include_tasks: httpi.yml
  tags:
    - packages

- name: Install OpenLens Desktop
  ansible.builtin.include_tasks: openlens.yml
  tags:
    - packages

- name: Install Chezmoi
  ansible.builtin.include_tasks: chezmoi.yml
  tags:
    - packages

# --- Herramientas de usuario (se ejecutan como el usuario de escritorio, no como root) ---

- name: Download Starship prompt
  ansible.builtin.get_url:
    url: https://github.com/starship-rs/starship/releases/download/v1.23.0/starship-x86_64-unknown-linux-gnu.tar.gz
    dest: /tmp/starship.tar.gz
    mode: "0644"
  become: true
  become_user: "{{ laptop_desktop_user }}"
  tags:
    - packages

- name: Extract Starship to user bin
  ansible.builtin.unarchive:
    src: /tmp/starship.tar.gz
    dest: "{{ ansible_env.HOME }}/.local/bin"
    remote_src: true
    includes:
      - starship-x86_64-unknown-linux-gnu/starship
  become: true
  become_user: "{{ laptop_desktop_user }}"
  tags:
    - packages

- name: Install xxh
  ansible.builtin.pip:
    name: xxh-xxh
    state: present
  become: true
  become_user: "{{ laptop_desktop_user }}"
  tags:
    - packages

- name: Install xxh plugins
  ansible.builtin.command: "xxh +I {{ item }}"
  loop:
    - xxh-shell-bash
    - xxh-plugin-prerun-dotfiles
    - xxh-plugin-prerun-starship+git+https://github.com/izissise/xxh-plugin-prerun-starship.git
  changed_when: false
  become: true
  become_user: "{{ laptop_desktop_user }}"
  tags:
    - packages

- name: Configure xxh
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.config/xxh/config.xxhc"
    create: true
    mode: "0644"
    block: |
      hosts:
        ".*":
          +s: bash
          +I: xxh-plugin-prerun-dotfiles
  become: true
  become_user: "{{ laptop_desktop_user }}"
  tags:
    - config

- name: Download Appimage Update Tool
  ansible.builtin.get_url:
    url: https://github.com/AppImage/AppImageUpdate/releases/download/2.0.0-alpha-1-20220124/appimageupdatetool-x86_64.AppImage
    dest: "{{ ansible_env.HOME }}/Applications/appimageupdatetool-x86_64.AppImage"
    mode: "0755"
  become: true
  become_user: "{{ laptop_desktop_user }}"
  tags:
    - packages
