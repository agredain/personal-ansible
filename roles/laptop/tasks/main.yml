---
# tasks file for laptop
# Referencias:
# https://dev.to/uf4no/my-kubuntu-osx-look-alike-desktop-setup-219g
# https://nerdfonts.com/

# Resuelve el home del usuario de escritorio (ver laptop_desktop_home en defaults).
- name: Get desktop user info
  ansible.builtin.getent:
    database: passwd
    key: "{{ laptop_desktop_user }}"
  tags:
    - always

- name: Create user directories
  ansible.builtin.file:
    path: "{{ laptop_desktop_home }}/{{ item }}"
    state: directory
    owner: "{{ laptop_desktop_user }}"
    group: "{{ laptop_desktop_user }}"
    mode: "0755"
  loop:
    - .local/bin
    - Applications
  tags:
    - packages
    - config

# Other repositories
- name: Extra Repositories
  ansible.builtin.apt_repository:
    repo: "{{ item }}"
    state: present
  loop:
    - ppa:libreoffice/ppa # LibreOffice PPA
    - ppa:nextcloud-devs/client
  tags:
    - repos

# Extra packages
- name: Install Extras Packages
  ansible.builtin.apt:
    name:
      - filelight # Ver el espacio ocupado por archivos y directorios de forma visual
      - gparted # Editor de particiones
      - hardinfo # Interfaz gráfica que muestra información del sistema, memoria, procesador, kernel, etc.
      - hplip
      - krename
      - libvlc5
      - meld
      - nextcloud-desktop
      - pdfmod # Editor PDF: reordenar, girar, quitar, añadir, combinar documentos.
      - picard # Análisis y reconocimiento de álbumes de música
      - pinta # Editor de imágenes
      - stacer # Optimización y monitoreo de sistemas Linux
      - simple-scan
      - variety # Cambia el fondo de escritorio de forma regular.
      - wakeonlan
      - vlc # Reproductor multimedia.
      - xbindkeys
      - pipx # Instalador de aplicaciones Python aisladas (xxh).
  tags:
    - packages

- name: Install Snap packages
  community.general.snap:
    name:
      - gitkraken
      - joplin-desktop
      - breaktimer # Pomodoro application
      - auto-cpufreq # Automatic CPU speed & power optimizer for Linux
    classic: true
  tags:
    - packages

- name: Install Brave
  ansible.builtin.include_tasks: brave.yml
  tags:
    - packages

- name: Install Enpass
  ansible.builtin.include_tasks: enpass.yml
  tags:
    - packages

- name: Install Typora
  ansible.builtin.include_tasks: typora.yml
  tags:
    - packages

- name: Install Httpi Desktop
  ansible.builtin.include_tasks: httpi.yml
  tags:
    - packages

- name: Install Chezmoi
  ansible.builtin.include_tasks: chezmoi.yml
  tags:
    - packages

- name: Install Plasmoids
  ansible.builtin.include_tasks: plasmoid.yml
  when: laptop_plasmoids | length > 0
  tags:
    - config

# --- Herramientas de usuario (se ejecutan como el usuario de escritorio, no como root) ---

- name: Download Starship prompt
  ansible.builtin.get_url:
    url: "https://github.com/starship/starship/releases/download/{{ laptop_starship_version }}/starship-x86_64-unknown-linux-gnu.tar.gz"
    dest: "/tmp/starship-{{ laptop_starship_version }}.tar.gz"
    mode: "0644"
  become: true
  become_user: "{{ laptop_desktop_user }}"
  tags:
    - packages

- name: Extract Starship to user bin
  ansible.builtin.unarchive:
    src: "/tmp/starship-{{ laptop_starship_version }}.tar.gz"
    dest: "{{ laptop_desktop_home }}/.local/bin"
    remote_src: true
    include:
      - starship
  become: true
  become_user: "{{ laptop_desktop_user }}"
  tags:
    - packages

- name: Install xxh
  community.general.pipx:
    name: xxh-xxh
    state: present
  become: true
  become_user: "{{ laptop_desktop_user }}"
  tags:
    - packages

- name: Install xxh plugins
  ansible.builtin.command: "{{ laptop_desktop_home }}/.local/bin/xxh +I {{ item.source }}"
  args:
    creates: "{{ laptop_desktop_home }}/.xxh/.xxh/plugins/{{ item.name }}"
  loop:
    - name: xxh-shell-bash
      source: xxh-shell-bash
    - name: xxh-plugin-prerun-dotfiles
      source: xxh-plugin-prerun-dotfiles
    - name: xxh-plugin-prerun-starship
      source: xxh-plugin-prerun-starship+git+https://github.com/izissise/xxh-plugin-prerun-starship.git
  loop_control:
    label: "{{ item.name }}"
  become: true
  become_user: "{{ laptop_desktop_user }}"
  tags:
    - packages

- name: Configure xxh
  ansible.builtin.blockinfile:
    path: "{{ laptop_desktop_home }}/.config/xxh/config.xxhc"
    create: true
    mode: "0644"
    block: |
      hosts:
        ".*":
          +s: bash
          +I: xxh-plugin-prerun-dotfiles
  become: true
  become_user: "{{ laptop_desktop_user }}"
  tags:
    - config

- name: Download Appimage Update Tool
  ansible.builtin.get_url:
    url: https://github.com/AppImage/AppImageUpdate/releases/download/2.0.0-alpha-1-20220124/appimageupdatetool-x86_64.AppImage
    dest: "{{ laptop_desktop_home }}/Applications/appimageupdatetool-x86_64.AppImage"
    mode: "0755"
  become: true
  become_user: "{{ laptop_desktop_user }}"
  tags:
    - packages
