# Ferdi (deb de GitHub releases)
- name: Get version list of Ferdi
  ansible.builtin.uri:
    url: https://api.github.com/repos/getferdi/ferdi/releases/latest
    return_content: true
    body_format: json
  register: laptop_ferdi
  changed_when: false
  tags:
    - packages

- name: Gather Ferdi version
  ansible.builtin.set_fact:
    laptop_ferdi_latest: "{{ laptop_ferdi.json.tag_name }}"
  tags:
    - packages

- name: Install Ferdi
  ansible.builtin.apt:
    deb: "https://github.com/getferdi/ferdi/releases/download/{{ laptop_ferdi_latest }}/ferdi_{{ laptop_ferdi_latest }}_amd64.deb"
    state: present
  tags:
    - packages
