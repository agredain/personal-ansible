# Enpass (repositorio apt con keyring firmado)
- name: Download Enpass signing key
  ansible.builtin.get_url:
    url: https://dl.sinew.in/keys/enpass-linux.key
    dest: /usr/share/keyrings/enpass-linux.gpg
    owner: root
    group: root
    mode: "0644"
  tags:
    - repos

- name: Add Enpass repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/enpass-linux.gpg] http://repo.sinew.in/ stable main"
    state: present
    filename: enpass
  tags:
    - repos

- name: Install Enpass
  ansible.builtin.apt:
    name: enpass
    state: present
  tags:
    - packages
