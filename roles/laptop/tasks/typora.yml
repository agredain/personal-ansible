# Typora (repositorio apt con keyring firmado)
- name: Download Typora signing key
  ansible.builtin.get_url:
    url: https://typora.io/linux/public-key.asc
    dest: /usr/share/keyrings/typora.asc
    owner: root
    group: root
    mode: "0644"
  tags:
    - repos

- name: Add Typora repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/typora.asc] https://typora.io/linux ./"
    state: present
    filename: typora
  tags:
    - repos

- name: Install Typora
  ansible.builtin.apt:
    name: typora
    state: present
  tags:
    - packages
