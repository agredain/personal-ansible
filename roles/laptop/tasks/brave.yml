# Brave Chrome (repositorio apt con keyring firmado)
- name: Get keyring file
  ansible.builtin.get_url:
    url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
    dest: "/usr/share/keyrings/brave-browser-archive-keyring.gpg"
    owner: root
    group: root
    mode: "0644"
  tags:
    - repos

- name: Add Brave repository to list of repositories
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg arch=amd64] https://brave-browser-apt-release.s3.brave.com/ stable main"
    state: present
    filename: brave-browser-release
  tags:
    - repos

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  tags:
    - repos

- name: Install Brave
  ansible.builtin.apt:
    name: brave-browser
    state: present
  tags:
    - packages
