# Chezmoi (gestor de dotfiles)
- name: Get version list of Chezmoi
  ansible.builtin.uri:
    url: https://api.github.com/repos/twpayne/chezmoi/releases/latest
    return_content: true
    body_format: json
  register: laptop_chezmoi
  changed_when: false
  tags:
    - packages

- name: Gather Chezmoi url
  ansible.builtin.set_fact:
    laptop_chezmoi_url: >-
      {{ laptop_chezmoi.json.assets
         | selectattr('browser_download_url', 'search', 'amd64\\.deb$')
         | map(attribute='browser_download_url') | first }}
  tags:
    - packages

- name: Install Chezmoi
  ansible.builtin.apt:
    deb: "{{ laptop_chezmoi_url }}"
    state: present
  tags:
    - packages

- name: Init Chezmoi
  ansible.builtin.command: chezmoi init https://github.com/agredain/dotfiles.git
  args:
    creates: "{{ laptop_desktop_home }}/.local/share/chezmoi"
  become: true
  become_user: "{{ laptop_desktop_user }}"
  tags:
    - config
