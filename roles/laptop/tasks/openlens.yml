# OpenLens (AppImage, se instala en el home del usuario de escritorio)
- name: Get version list of OpenLens
  ansible.builtin.uri:
    url: https://api.github.com/repos/MuhammedKalkan/OpenLens/releases/latest
    return_content: true
    body_format: json
  register: laptop_open_lens
  changed_when: false
  tags:
    - packages

- name: Gather OpenLens version
  ansible.builtin.set_fact:
    laptop_open_lens_latest: "{{ laptop_open_lens.json.tag_name }}"
  tags:
    - packages

- name: Install OpenLens
  ansible.builtin.get_url:
    url: "https://github.com/MuhammedKalkan/OpenLens/releases/download/{{ laptop_open_lens_latest }}/OpenLens-{{ laptop_open_lens_latest }}.AppImage"
    dest: "{{ ansible_env.HOME }}/Applications/OpenLens.AppImage"
    mode: "0755"
  become: true
  become_user: "{{ laptop_desktop_user }}"
  tags:
    - packages
