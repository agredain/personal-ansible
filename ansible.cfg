[defaults]
# El directorio inventories/ contiene inventory.yml (sin secretos) y
# vault.yml (cifrado). Ansible fusiona ambos automáticamente.
inventory = inventories/
# Roles locales primero; luego los de Galaxy instalados en .ansible/roles
# (gitignored y excluidos de ansible-lint).
roles_path = roles:.ansible/roles:~/.ansible/roles
# Colecciones de Galaxy instaladas en .ansible/collections (gitignored).
collections_path = .ansible/collections:~/.ansible/collections
deprecation_warnings = True
timeout = 30
# La clave vault NO se fija aquí (path específico de la máquina).
# Se inyecta con ANSIBLE_VAULT_PASSWORD_FILE (upgrade.sh ya lo exporta).

[connection]
pipelining = True

